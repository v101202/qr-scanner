<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер лояльности</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #17212b;
            color: #f5f6f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            background-color: #5288c1;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active { background-color: #4676a8; }
    </style>
</head>
<body>
    <h2>Сканер карт ресторана</h2>
    <button id="scan-btn">📷 Открыть камеру</button>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let scannedText = null;
let scannerClosed = false;

function tryFinish() {
    if (!scannedText || !scannerClosed) return;

    // Both conditions met — proceed once
    const text = scannedText;
    scannedText = null;
    scannerClosed = false;

    console.log('Sending data and closing:', text);
    tg.sendData(text);

    // Small delay ensures web_app_data_send is flushed before close
    setTimeout(() => {
        tg.close();
    }, 50);
}

// Capture the scanned text whenever the callback fires
tg.onEvent('qr_text_received', (payload) => {
    if (payload && payload.data) {
        scannedText = payload.data;
        console.log('qr_text_received:', scannedText);
        tryFinish();
    }
});

// Mark scanner as closed
tg.onEvent('scan_qr_popup_closed', () => {
    scannerClosed = true;
    console.log('scan_qr_popup_closed, scannedText =', scannedText);
    tryFinish();
});

document.getElementById('scan-btn').addEventListener('click', () => {
    scannedText = null;
    scannerClosed = false;

    tg.showScanQrPopup(
        { text: "Наведите камеру на QR-код гостя 1" },
        function(text) {
            if (text) {
                scannedText = text;
                console.log('callback fired:', scannedText);
                tryFinish();
            }
            return true;
        }
    );
});
</script>
</body>
</html>
