<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер лояльности</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #17212b;
            color: #f5f6f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            background-color: #5288c1;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active { background-color: #4676a8; }
        #status { margin-top: 20px; font-size: 14px; color: #8aa; }
    </style>
</head>
<body>
    <h2>Сканер карт ресторана</h2>
    <button id="scan-btn">📷 Открыть камеру</button>
    <div id="status"></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

    console.log("Bot API version:", tg.version);
console.log("closeScanQrPopup type:", typeof tg.closeScanQrPopup);
    
document.getElementById('scan-btn').addEventListener('click', () => {
    tg.showScanQrPopup(
        { text: "Наведите камеру на QR-код" },
        function(text) {
            console.log('Callback fired, text:', text);
            
            // This return true is what closes the popup
            if (text) {
                tg.sendData(text);
                tg.close();
            }
            return true;  // CRITICAL: tells Telegram to close the scanner
        }
    );
});
</script>
    
    
</body>
</html>
