<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер лояльности</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #17212b;
            color: #f5f6f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            background-color: #5288c1;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active { background-color: #4676a8; }
        #status { margin-top: 20px; font-size: 14px; color: #8aa; }
    </style>
</head>
<body>
    <h2>Сканер карт ресторана</h2>
    <button id="scan-btn">📷 Открыть камеру</button>
    <div id="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const status = document.getElementById('status');
document.getElementById('scan-btn').addEventListener('click', async () => {
    const params = { text: "Наведите камеру на QR-код гостя" };

    // Try modern Promise form first
    let text;
    try {
        const maybePromise = tg.showScanQrPopup(params);
        if (maybePromise && typeof maybePromise.then === "function") {
            text = await maybePromise;
        } else {
            // fallback: old callback form
            text = await new Promise((resolve, reject) => {
                tg.showScanQrPopup(params, (t) => { resolve(t); return true; });
                // note: no reject path in old API
            });
        }
    } catch (e) {
        console.log("scan cancelled:", e);
        return;
    }

    if (text) {
        tg.sendData(text);
        tg.close();
    }
});
    </script>
</body>
</html>
