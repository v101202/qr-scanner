<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер лояльности</title>
    <!-- Подключаем официальный скрипт Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #17212b;
            color: #f5f6f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            background-color: #5288c1;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active { background-color: #4676a8; }
    </style>
</head>
<body>
    <h2>Сканер карт ресторана</h2>
    <button id="scan-btn">📷 Открыть камеру</button>

    <script>
        // Инициализируем Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Разворачиваем окно на весь экран
alert(`platform=${tg.platform} version=${tg.version} initData=${tg.initData.length} chars`);
document.getElementById('scan-btn').addEventListener('click', () => {
    tg.showScanQrPopup(
        { text: "Наведите камеру на QR-код гостя" },
        function (text) {
            alert("SCANNED: " + text);
            try {
                tg.sendData(text);
                alert("sendData OK");
            } catch (e) {
                alert("sendData FAIL: " + e.message);
            }
            tg.close();
            return true;
        }
    );
});
    </script>
</body>
</html>
