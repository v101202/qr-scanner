<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер лояльности</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #17212b;
            color: #f5f6f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            background-color: #5288c1;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active { background-color: #4676a8; }
    </style>
</head>
<body>
    <h2>Сканер карт ресторана</h2>
    <button id="scan-btn">📷 Открыть камеру 1</button>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

document.getElementById('scan-btn').addEventListener('click', () => {
    let pendingText = null;
    let closed = false;

    // When Telegram confirms the scanner popup is actually closed,
    // THEN send data and close the Mini App.
    const onScannerClosed = () => {
        if (closed) return;
        closed = true;
        tg.offEvent('scan_qr_popup_closed', onScannerClosed);

        if (pendingText) {
            tg.sendData(pendingText);
            tg.close();
        }
    };

    tg.onEvent('scan_qr_popup_closed', onScannerClosed);

    tg.showScanQrPopup(
        { text: "Наведите камеру на QR-код гостя" },
        function(text) {
            if (text) {
                pendingText = text;
            }
            return true; // Ask Telegram to close the scanner popup
        }
    );
});
</script>
</body>
</html>
