<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер лояльности</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #17212b;
            color: #f5f6f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            background-color: #5288c1;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active { background-color: #4676a8; }
    </style>
</head>
<body>
    <h2>Сканер карт ресторана</h2>
    <button id="scan-btn">📷 Открыть камеру 2</button>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const btn = document.getElementById('scan-btn');

// Remove any prior listener by cloning the node (nuclear but effective)
const freshBtn = btn.cloneNode(true);
btn.parentNode.replaceChild(freshBtn, btn);

freshBtn.addEventListener('click', () => {
    let pendingText = null;
    let finished = false;

    const onClosed = () => {
        if (finished) return;
        finished = true;
        tg.offEvent('scan_qr_popup_closed', onClosed);
        console.log('scanner closed, pendingText =', pendingText);

        if (pendingText) {
            tg.sendData(pendingText);
            tg.close();
        }
    };

    tg.onEvent('scan_qr_popup_closed', onClosed);

    tg.showScanQrPopup(
        { text: "Наведите камеру на QR-код гостя" },
        (text) => {
            console.log('scan callback fired, text =', text);
            if (text) {
                pendingText = text;
            }
            return true;
        }
    );
});
</script>
</body>
</html>
