<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер лояльности</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #17212b;
            color: #f5f6f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            background-color: #5288c1;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active { background-color: #4676a8; }
        #status { margin-top: 20px; font-size: 14px; color: #8aa; }
    </style>
</head>
<body>
    <h2>Сканер карт ресторана</h2>
    <button id="scan-btn">📷 Открыть камеру</button>
    <div id="status"></div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const status = document.getElementById('status');
    let scanHandled = false;   // guard against the 5x repeated event

    // Telegram delivers the decoded QR here on Android/WebView.
    // We must close the popup ourselves.
    tg.onEvent('qr_text_received', (payload) => {
        const text = payload && payload.data;
        console.log('qr_text_received:', text);

        if (scanHandled) return;      // ignore the 4 duplicate deliveries
        scanHandled = true;

        // Close the native scanner popup — THIS is what was missing.
        tg.closeScanQrPopup();

        if (!text) {
            status.textContent = "QR не распознан.";
            return;
        }

        status.textContent = "Отправляю: " + text;
        try {
            tg.sendData(text);
            tg.close();
        } catch (e) {
            status.textContent = "Ошибка отправки: " + e.message;
            console.error("sendData failed:", e);
        }
    });

    // Reset the guard whenever the scanner is closed, so the button
    // can be used again for the next guest.
    tg.onEvent('scan_qr_popup_closed', () => {
        console.log('scan_qr_popup_closed');
        scanHandled = false;
    });

    document.getElementById('scan-btn').addEventListener('click', () => {
        scanHandled = false;
        status.textContent = "Открываю камеру…";
        tg.showScanQrPopup({ text: "Наведите камеру на QR-код гостя" });
        // NOTE: no callback here. We rely on qr_text_received above.
    });
</script>
    
</body>
</html>
